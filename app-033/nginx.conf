# nginx 配置：SPA 回退；哈希资源 immutable；index.html no-cache；gzip；健康检查
# 该文件同时内联进 Dockerfile（.dockerignore 按规格书排除本文件，镜像内配置由 Dockerfile 生成，内容一致）

server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    charset utf-8;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- gzip ----------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/font-woff2;

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log  off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- 哈希构建资源：永久 immutable ----------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 本地字体：随版本更新，缓存 30 天 ----------
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---------- 示例数据不缓存 ----------
    location /samples/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ---------- index.html：禁止缓存 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # ---------- SPA 回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
